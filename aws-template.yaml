AWSTemplateFormatVersion: '2010-09-09'
Description: CineFlix DynamoDB, private avatar storage and EC2 application role. Hosting is deployed separately.
Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]{1,20}'
Resources:
  MovieRecomUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'MovieRecom_Users_${EnvironmentName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  MovieRecomWatchlistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'MovieRecom_Watchlists_${EnvironmentName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: imdbID
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: imdbID
          KeyType: RANGE
  MovieRecomRatingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'MovieRecom_Ratings_${EnvironmentName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: imdbID
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: imdbID
          KeyType: RANGE
  MovieRecomAvatarBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'cineflix-avatars-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  MovieRecomAvatarBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MovieRecomAvatarBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MovieRecomAvatarBucket.Arn
              - !Sub '${MovieRecomAvatarBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  MovieRecomBackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CineFlixDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt MovieRecomUsersTable.Arn
                  - !GetAtt MovieRecomWatchlistsTable.Arn
                  - !GetAtt MovieRecomRatingsTable.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MovieRecomAvatarBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${MovieRecomAvatarBucket.Arn}/avatars/*'
  MovieRecomInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MovieRecomBackendRole
Outputs:
  DynamoDBUsersTable:
    Value: !Ref MovieRecomUsersTable
  DynamoDBWatchlistsTable:
    Value: !Ref MovieRecomWatchlistsTable
  DynamoDBRatingsTable:
    Value: !Ref MovieRecomRatingsTable
  S3AvatarBucketName:
    Value: !Ref MovieRecomAvatarBucket
  BackendInstanceProfile:
    Value: !Ref MovieRecomInstanceProfile
